name: MSVC Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore "vpl generator.sln"

    - name: Build solution
      run: msbuild "vpl generator.sln" /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpl-generator-x64-release
        path: x64/Release/vpl generator.exe
        if-no-files-found: error
