name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild "vpl generator.sln" /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpl-generator-windows-x64
        path: x64/Release/vpl generator.exe
        if-no-files-found: error
